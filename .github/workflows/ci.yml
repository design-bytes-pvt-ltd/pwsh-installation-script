name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  powershell-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell test dependencies
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./install.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Validate models.json against schema
        shell: pwsh
        run: |
          $schema = Get-Content ./models.schema.json -Raw
          Test-Json -Path ./models.json -Schema $schema | Out-Null

      - name: Smoke test -WhatIf (pwsh)
        shell: pwsh
        run: |
          ./install.ps1 -WhatIf -SkipModels
          ./install.ps1 -WhatIf -Models qwen3:0.6b

      - name: Smoke test -WhatIf (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -WhatIf -SkipModels
          .\install.ps1 -WhatIf -Models qwen3:0.6b
